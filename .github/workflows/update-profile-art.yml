name: Update profile art

on:
  schedule:
    # Every day at 06:17 UTC
    - cron: "17 6 * * *"

  # Allows you to run it manually from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest

    steps:
      # ==================================================
      # CHECK OUT YOUR REPOSITORY
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==================================================
      # SET UP PYTHON
      # ==================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==================================================
      # INSTALL ONLY WHAT THE HEATMAP NEEDS
      # ==================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.3 beautifulsoup4==4.12.3

      # ==================================================
      # FETCH REAL GITHUB CONTRIBUTIONS
      # ==================================================

      - name: Fetch contributions
        run: |
          python scripts/fetch_contributions.py

      # ==================================================
      # REGENERATE HEATMAP SVG
      # ==================================================

      - name: Render heatmap
        run: |
          python scripts/render_heatmap_svg.py

      # ==================================================
      # COMMIT ONLY IF SOMETHING CHANGED
      # ==================================================

      - name: Commit updated heatmap
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/contributions.json contrib-heatmap.svg

          if git diff --cached --quiet; then
            echo "No contribution changes detected."
            exit 0
          fi

          git commit -m "chore: refresh contribution graph"
          git push
