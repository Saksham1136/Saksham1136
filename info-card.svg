<svg
xmlns="http://www.w3.org/2000/svg"
width="490"
height="390"
viewBox="0 0 490 390">

<rect
    x="1"
    y="1"
    width="488"
    height="388"
    rx="12"
    fill="#0d1117"
    stroke="#30363d"
    stroke-width="2"
/>

<style>

    .terminal {
        font-family:
            "Courier New",
            "Liberation Mono",
            monospace;
    }

    .title {
        fill: #c9d1d9;
        font-size: 15px;
        font-weight: bold;
    }

    .key {
        fill: #39d353;
        font-size: 14px;
        font-weight: bold;
    }

    .value {
        fill: #c9d1d9;
        font-size: 14px;
    }

    .muted {
        fill: #8b949e;
        font-size: 12px;
    }

    .highlight {
        fill: #58a6ff;
        font-size: 13px;
    }

    .line {
        opacity: 0;

        animation:
            appear 0.45s ease-out
            forwards;
    }

    @keyframes appear {

        from {
            opacity: 0;
            transform: translateX(-10px);
        }

        to {
            opacity: 1;
            transform: translateX(0);
        }

    }

</style>


